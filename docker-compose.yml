services:
  bizforgex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizforgex-app
    restart: unless-stopped
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      # Route bizforgex.bhashaai.in as well as sslip.io and direct IP
      - "traefik.http.routers.bizforgex.rule=Host(`bizforgex.bhashaai.in`) || Host(`bizforgex.129.225.111.150.sslip.io`) || Host(`129.225.111.150`)"
      - "traefik.http.routers.bizforgex.entrypoints=http"
      - "traefik.http.services.bizforgex.loadbalancer.server.port=80"
      - "coolify.managed=true"

networks:
  coolify:
    external: true
